services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT}:5432'
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      AUTH_MAGIC_LINK_LANDING_URL: ${AUTH_MAGIC_LINK_LANDING_URL:-http://127.0.0.1:3000/login/magic}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEFAULT_BASE_CURRENCY: ${DEFAULT_BASE_CURRENCY:-CNY}
      DEFAULT_UI_LANGUAGE: ${DEFAULT_UI_LANGUAGE:-zh-CN}
      INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-604800}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
      MAGIC_LINK_RATE_LIMIT_MAX_REQUESTS: ${MAGIC_LINK_RATE_LIMIT_MAX_REQUESTS:-5}
      MAGIC_LINK_RATE_LIMIT_WINDOW_SECONDS: ${MAGIC_LINK_RATE_LIMIT_WINDOW_SECONDS:-300}
      MAGIC_LINK_TTL_SECONDS: ${MAGIC_LINK_TTL_SECONDS:-900}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-capture}
      OBJECT_ALLOWED_MEDIA_TYPES: ${OBJECT_ALLOWED_MEDIA_TYPES:-application/pdf,image/jpeg,image/png,text/plain}
      OBJECT_MAX_FILE_BYTES: ${OBJECT_MAX_FILE_BYTES:-10485760}
      OBJECT_MAX_USER_TOTAL_BYTES: ${OBJECT_MAX_USER_TOTAL_BYTES:-104857600}
      OBJECT_STORAGE_ROOT: /var/lib/travel-objects
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '127.0.0.1:${API_PORT}:3000'
    restart: unless-stopped
    volumes:
      - object-storage-data:/var/lib/travel-objects

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_MAGIC_LINK_LANDING_URL: ${AUTH_MAGIC_LINK_LANDING_URL:-http://127.0.0.1:3000/login/magic}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JOB_EXECUTION_TIMEOUT_MS: ${JOB_EXECUTION_TIMEOUT_MS:-15000}
      JOB_LEASE_DURATION_MS: ${JOB_LEASE_DURATION_MS:-30000}
      JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-1000}
      JOB_RETRY_BASE_DELAY_MS: ${JOB_RETRY_BASE_DELAY_MS:-1000}
      JOB_RETRY_MAX_DELAY_MS: ${JOB_RETRY_MAX_DELAY_MS:-300000}
      MAGIC_LINK_TOKEN_KEY: ${MAGIC_LINK_TOKEN_KEY}
      MAGIC_LINK_TTL_SECONDS: ${MAGIC_LINK_TTL_SECONDS:-900}
      MAIL_CAPTURE_FILE: /tmp/travel-mail-capture/messages.ndjson
      MAIL_PROVIDER: ${MAIL_PROVIDER:-capture}
      WORKER_ID: ${WORKER_ID:-compose-worker}
      WORKER_HEARTBEAT_FILE: /tmp/travel-worker-heartbeat.json
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS}
      WORKER_HEARTBEAT_MAX_AGE_MS: ${WORKER_HEARTBEAT_MAX_AGE_MS}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-10000}
    healthcheck:
      test: ['CMD', 'node', 'scripts/check-worker-health.mjs']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: 'no'

volumes:
  object-storage-data:
  postgres-data:
