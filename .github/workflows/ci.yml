name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: travel_ci
          POSTGRES_PASSWORD: SYNTHETIC_CI_ONLY
          POSTGRES_USER: travel_ci
        options: >-
          --health-cmd "pg_isready -U travel_ci -d travel_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://travel_ci:SYNTHETIC_CI_ONLY@127.0.0.1:5432/travel_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
