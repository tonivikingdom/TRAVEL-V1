name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: travel_ci
          POSTGRES_PASSWORD: SYNTHETIC_CI_ONLY
          POSTGRES_USER: travel_ci
        options: >-
          --health-cmd "pg_isready -U travel_ci -d travel_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://travel_ci:SYNTHETIC_CI_ONLY@127.0.0.1:5432/travel_ci
      TEST_DATABASE_URL: postgresql://travel_ci:SYNTHETIC_CI_ONLY@127.0.0.1:5432/travel_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:validate
      - run: pnpm db:migrate:deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  compose-verify:
    name: Compose verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Create synthetic Compose environment
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/travel-v1-compose.env" <<'EOF'
          COMPOSE_PROJECT_NAME=travel-v1-compose-ci
          API_PORT=39000
          POSTGRES_DB=travel_ci_compose
          POSTGRES_USER=travel_ci_compose
          POSTGRES_PASSWORD=SYNTHETIC_CI_ONLY
          POSTGRES_HOST_PORT=35432
          AUTH_MAGIC_LINK_LANDING_URL=http://127.0.0.1:39000/login/magic
          MAGIC_LINK_TOKEN_KEY=SYNTHETIC_CI_MAGIC_LINK_TOKEN_KEY_0123456789abcdef
          MAIL_PROVIDER=capture
          JOB_MAX_ATTEMPTS=5
          JOB_LEASE_DURATION_MS=5000
          JOB_POLL_INTERVAL_MS=250
          JOB_RETRY_BASE_DELAY_MS=500
          JOB_RETRY_MAX_DELAY_MS=5000
          JOB_EXECUTION_TIMEOUT_MS=3000
          WORKER_SHUTDOWN_TIMEOUT_MS=5000
          WORKER_HEARTBEAT_INTERVAL_MS=1000
          WORKER_HEARTBEAT_MAX_AGE_MS=3000
          EOF
      - name: Build and verify Compose services
        run: node scripts/verify-compose.mjs --env-file "$RUNNER_TEMP/travel-v1-compose.env"
