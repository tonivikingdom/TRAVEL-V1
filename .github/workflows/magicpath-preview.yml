name: MagicPath desktop preview

on:
  pull_request:
    paths:
      - 'ui-previews/magicpath-desktop/**'
      - 'design-snapshots/magicpath/**'
      - 'docs/status/assets/issue-67-desktop-layout/**'
      - 'docs/status/assets/issue-67-card-review/**'
      - '.github/workflows/magicpath-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-previews/magicpath-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          package_json_file: ui-previews/magicpath-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:snapshot
      - run: pnpm verify:layout-evidence
      - run: pnpm verify:card-evidence
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
